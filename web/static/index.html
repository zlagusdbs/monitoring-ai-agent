<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>index monitor</title>
<style>
:root{
  --bg:#f6f6f4; --panel:#fff; --line:#e3e2dd; --txt:#24241f; --dim:#6f6e68;
  --red:#a32d2d; --amber:#854f0b; --green:#3b6d11; --accent:#185fa5;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#17171a;--panel:#1f1f23;--line:#32323a;--txt:#e6e5e0;--dim:#9c9a92;
        --red:#f09595;--amber:#efa027;--green:#97c459;--accent:#85b7eb;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);--chatw:420px;
     font:14px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;height:100vh;
     display:grid;grid-template-columns:1fr 7px var(--chatw);gap:7px;padding:10px}
.left{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto;padding-right:3px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;
       padding:12px 14px;min-height:0;flex:none}
h2{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--dim);
   text-transform:uppercase;letter-spacing:.06em}
.hd{cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px}
.hd::before{content:"\25BE";font-size:9px;line-height:1;transition:transform .12s}
.sec.closed .hd::before{transform:rotate(-90deg)}
.sec.closed .hd{margin-bottom:0}
.sec.closed .bd{display:none}
.bd{overflow:auto;resize:vertical;min-height:34px}
.sec + .sec{margin-top:12px}
.split{align-self:stretch;cursor:col-resize;border-radius:4px;background:var(--line);
       opacity:.5}
.split:hover,.split.on{opacity:1;background:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.row{display:flex;gap:8px;align-items:stretch;margin-bottom:8px}
.row:last-child{margin-bottom:0}
.rowlab{width:58px;flex:none;display:flex;align-items:center;font-family:var(--mono);
        font-size:11.5px;color:var(--dim)}
.row .card{flex:1;min-width:120px;overflow:hidden}
.card{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.card .k{font-size:11px;color:var(--dim)}
.card .v{font-family:var(--mono);font-size:15px;margin-top:2px;word-break:break-all}
.rule{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.rule:first-of-type{border-top:0}
.badge{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:5px;
       border:1px solid currentColor;flex:none;margin-top:2px}
.firing{color:var(--red)} .ok{color:var(--green)} .skipped{color:var(--dim)}
.rule .t{font-weight:500} .rule .d{color:var(--dim);font-size:12.5px}
.chat{display:flex;flex-direction:column;min-height:0;gap:8px}
#log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:9px}
.chat.closed{flex:none}
.msg{white-space:pre-wrap;word-break:break-word}
.me{align-self:flex-end;background:var(--accent);color:#fff;padding:6px 10px;
    border-radius:10px;max-width:85%}
.bot{max-width:100%}
.tool{font-family:var(--mono);font-size:11.5px;color:var(--dim);
      border-left:2px solid var(--line);padding-left:8px}
form{display:flex;gap:6px}
input{flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
      background:var(--bg);color:var(--txt);font:inherit}
button{padding:9px 14px;border:0;border-radius:8px;background:var(--accent);
       color:#fff;font:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.foot{font-size:11.5px;color:var(--dim);font-family:var(--mono)}
.prop{border:1px solid var(--amber);border-radius:8px;padding:9px 11px;margin-top:8px}
.prop .h{font-weight:500;margin-bottom:4px}
.prop pre{font-family:var(--mono);font-size:11px;margin:0 0 8px;white-space:pre-wrap;
          color:var(--dim)}
.prop button{padding:5px 11px;font-size:12.5px;margin-right:6px}
.prop .no{background:transparent;color:var(--dim);border:1px solid var(--line)}
.act{margin-top:6px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.act code{font-family:var(--mono);font-size:11px;color:var(--dim)}
.act button{padding:4px 10px;font-size:12px;background:var(--red)}
.out{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:5px;
     white-space:pre-wrap;word-break:break-all}
.bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-family:var(--mono);
     font-size:11.5px;color:var(--dim);background:var(--panel);border:1px solid var(--line);
     border-radius:10px;padding:9px 14px}
.bar b{color:var(--txt);font-weight:600}
.sw{padding:3px 9px;font-size:11.5px;background:var(--line);color:var(--txt)}
.sw.on{background:var(--green);color:#fff}
.rep{max-height:230px}
.ev{padding:6px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .w{font-family:var(--mono);font-size:11px;color:var(--dim)}
.ev .sub{margin-left:14px;font-size:12.5px}
.ev .sub .r{color:var(--dim)}
.v-execute{color:var(--green)} .v-hold{color:var(--amber)}
.v-escalate{color:var(--red);font-weight:600} .v-no_decision{color:var(--dim)}
.todo{margin-top:8px;border-top:1px solid var(--line);padding-top:7px;font-size:12.5px}
.rbtn{padding:3px 8px;font-size:11px;background:transparent;color:var(--dim);
      border:1px solid var(--line);margin-left:6px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:right;font-weight:600;color:var(--dim);font-size:11px;
        padding:4px 6px;border-bottom:1px solid var(--line)}
.tbl th:first-child{text-align:left}
.tbl td{text-align:right;padding:4px 6px;border-bottom:1px solid var(--line);
        font-family:var(--mono);font-size:11.5px}
.tbl td.ep{text-align:left;font-family:inherit;font-size:12.5px;word-break:break-all}
.tbl td.bad{color:var(--red);font-weight:600}
.tbl tr:last-child td{border-bottom:0}
</style>
</head>
<body>
<div class="left">
  <div class="bar" id="bar">불러오는 중</div>
  <div class="panel sec" data-k="rep"><h2 class="hd">켜 둔 동안 있었던 일</h2>
    <div class="bd" id="rep" style="height:190px"></div></div>
  <div class="panel">
    <div class="sec" data-k="cl"><h2 class="hd">클러스터</h2><div class="bd" id="cl"></div></div>
    <div class="sec" data-k="ix"><h2 class="hd">색인</h2><div class="bd" id="ix"></div></div>
    <div class="sec" data-k="tf"><h2 class="hd">트래픽 · 지연</h2>
      <div class="bd" id="tf"></div></div>
  </div>
  <div class="panel sec" data-k="rules"><h2 class="hd">규칙 판정</h2>
    <div class="bd" id="rules" style="height:240px"></div></div>
  <div class="panel sec" data-k="plan"><h2 class="hd">Plan — 에이전트가 하는 일</h2>
    <div class="bd" id="plan" style="height:120px"><div class="foot">대기 중</div></div></div>
</div>
<div class="split" id="split" title="끌어서 폭 조절"></div>
<div class="panel chat sec" data-k="chat">
  <h2 class="hd">채팅</h2>
  <div class="bd" id="log" style="resize:none">
  <form id="f"><input id="q" placeholder="무엇이든 물어보세요" autocomplete="off">
    <button id="send">보내기</button></form>
  <div id="foot" class="foot"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const mem={
  get:k=>{try{return localStorage.getItem(k)}catch{return null}},
  set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}},
};

function initSections(){
  document.querySelectorAll(".sec").forEach(sec=>{
    const key="ui:"+sec.dataset.k, hd=sec.querySelector(".hd"), bd=sec.querySelector(".bd");
    if(mem.get(key+":closed")==="1") sec.classList.add("closed");
    const h=mem.get(key+":h"); if(h&&bd) bd.style.height=h;
    hd.addEventListener("click",()=>{
      sec.classList.toggle("closed");
      mem.set(key+":closed", sec.classList.contains("closed")?"1":"0");
    });
    if(bd&&window.ResizeObserver){
      new ResizeObserver(()=>{ if(bd.style.height) mem.set(key+":h", bd.style.height); })
        .observe(bd);
    }
  });
  const w=mem.get("ui:chatw"); if(w) document.body.style.setProperty("--chatw",w);
  const sp=$("#split");
  sp.addEventListener("mousedown",e=>{
    e.preventDefault(); sp.classList.add("on");
    const move=ev=>{
      const w=Math.min(900,Math.max(260,innerWidth-ev.clientX-14))+"px";
      document.body.style.setProperty("--chatw",w); mem.set("ui:chatw",w);
    };
    const up=()=>{ sp.classList.remove("on");
      removeEventListener("mousemove",move); removeEventListener("mouseup",up); };
    addEventListener("mousemove",move); addEventListener("mouseup",up);
  });
  sp.addEventListener("dblclick",()=>{
    document.body.style.setProperty("--chatw","420px"); mem.set("ui:chatw","420px");
  });
}
initSections();
function planLine(t){const d=document.createElement("div");d.textContent=t;$("#plan").appendChild(d);$("#plan").scrollTop=1e9;}
const ago=t=>t?Math.max(0,Math.floor(Date.now()/1000)-t)+"초 전":"-";

async function refresh(){
  let d; try{ d=await (await fetch("/api/status")).json(); }catch{ return; }
  if(!d.ready){ $("#cl").textContent=d.reason; return; }
  const card=([k,v])=>`<div class="card"><div class="k">${k}</div><div class="v">${v??"-"}</div></div>`;
  const by=(m,f)=>Object.fromEntries((d.metrics[m]||[]).map(x=>[f(x.labels), x]));
  const num=(x,n=1)=>x&&x.value!=null?x.value.toFixed(n):"-";

  const row=(lab,cards)=>`<div class="row"><div class="rowlab">${lab}</div>${cards.map(card).join("")}</div>`;

  const st=by("cluster_status",l=>l.cluster), cpu=by("es_cpu_percent",l=>l.cluster),
        hp=by("es_heap_percent",l=>l.cluster), qps=by("es_search_qps",l=>l.cluster);
  const clusters=[...new Set((d.metrics.cluster_status||[]).map(x=>x.labels.cluster))].sort();
  $("#cl").innerHTML=clusters.map(c=>row(c,[
    ["상태", st[c]?.text],
    ["CPU",  num(cpu[c])+" %"],
    ["Heap", num(hp[c])+" %"],
    ["검색", qps[c]?.value!=null?Math.round(qps[c].value).toLocaleString()+" q/s":"-"],
  ])).join("");

  const al=by("alias_index",l=>l.cluster+"|"+l.alias);
  const dc=by("index_docs",l=>l.cluster+"|"+l.index);
  const aliases=[...new Set((d.metrics.alias_index||[]).map(x=>x.labels.alias))].sort();
  const ixRows=clusters.map(c=>row(c,
    aliases.map(a=>{
      const m=al[c+"|"+a];
      const n=m&&dc[c+"|"+m.text];
      return [a, m?`${m.text}${n?"  ("+n.value.toLocaleString()+")":""}`:"-"];
    })));
  const tp=(d.metrics.topic_offset_latest||[]).map(m=>
    [m.labels.topic.replace(/^indexed\d+_/,""), (m.value||0).toLocaleString()]);
  if(tp.length) ixRows.push(row("토픽", tp));
  $("#ix").innerHTML=ixRows.join("");

  const one=m=>(d.metrics[m]||[])[0];
  const ms=m=>{const x=one(m); return x&&x.value!=null?x.value.toLocaleString(undefined,
    {maximumFractionDigits:1})+" ms":"-";};
  const rps=one("api_rps");
  const hasDD=(d.metrics.api_rps||d.metrics.api_latency_p99_ms||[]).length>0;

  if(!hasDD){
    $("#tf").innerHTML=card(["Datadog", "미연결 (DD_API_KEY 필요)"]);
  }else{
    const ep={};
    const put=(metric,key)=>(d.metrics[metric]||[]).forEach(m=>{
      const r=m.labels.resource_name; if(!r) return;
      (ep[r]=ep[r]||{})[key]=m.value;
    });
    put("endpoint_rps","rps");
    put("endpoint_latency_p99_ms","p99");
    put("endpoint_latency_max_ms","max");
    (d.metrics.endpoint_status_rps||[]).forEach(m=>{
      const r=m.labels.resource_name, c=String(m.labels["http.status_code"]||"");
      if(!r||!c.startsWith("5")) return;
      const e=ep[r]=ep[r]||{}; e.e5xx=(e.e5xx||0)+(m.value||0);
    });
    const fmt=(v,u)=>v==null?"-":v.toLocaleString(undefined,{maximumFractionDigits:1})+u;
    const rows=Object.entries(ep)
      .sort((a,b)=>(b[1].rps||0)-(a[1].rps||0))
      .map(([name,e])=>`<tr><td class="ep">${name}</td><td>${fmt(e.rps,"")}</td>
        <td>${fmt(e.p99," ms")}</td><td>${fmt(e.max," ms")}</td>
        <td class="${e.e5xx?"bad":""}">${fmt(e.e5xx||0,"")}</td></tr>`).join("");
    $("#tf").innerHTML=
      `<div class="cards" style="margin-bottom:9px">
         ${card(["요청", rps&&rps.value!=null?num(rps,1)+" req/s":"-"])}
         ${card(["p50", ms("api_latency_p50_ms")])}
         ${card(["p99", ms("api_latency_p99_ms")])}
         ${card(["max", ms("api_latency_max_ms")])}
       </div>`
      + (rows?`<table class="tbl"><thead><tr><th>엔드포인트</th><th>요청/s</th>
         <th>p99</th><th>max</th><th>5xx</th></tr></thead><tbody>${rows}</tbody></table>`:"");
  }

  const order={firing:0,skipped:1,ok:2};
  $("#rules").innerHTML=(d.rules||[])
    .sort((a,b)=>(order[a.state]??9)-(order[b.state]??9))
    .map(r=>{
      const a=r.action||{};
      const act=(r.state==="firing"&&a.type==="throttle")
        ? `<div class="act"><code>${a.uri} ${a.rate}% ${a.ttl_minutes}분</code>
           <button onclick='runThrottle(this,${JSON.stringify(JSON.stringify(a))})'>차단 실행</button></div>`
        : (a.type==="throttle"
           ? `<div class="act"><code>발동 시: ${a.uri} ${a.rate}% ${a.ttl_minutes}분</code></div>` : "");
      return `<div class="rule"><span class="badge ${r.state}">${r.state}</span>
        <span style="flex:1"><span class="t">${r.title}</span> <span class="d">· ${r.severity}</span>
        <button class="rbtn" onclick="ruleEnabled('${r.id}',false)">끄기</button>
        <button class="rbtn" onclick="ruleDelete('${r.id}')">지우기</button>
        <div class="d">${r.detail||""}</div>${act}</span></div>`;
    }).join("");
  $("#foot").textContent=`표본 ${d.samples.toLocaleString()}행 · 마지막 수집 ${ago(d.last_collect)}`;
}
async function refreshReport(){
  let d, st;
  try{ d=await (await fetch("/api/report")).json();
       st=await (await fetch("/api/settings")).json(); }catch{ return; }
  const on=st.auto_check==="on";
  const since=new Date(d.started*1000).toLocaleTimeString("ko-KR",{hour12:false});
  const mins=Math.floor((d.now-d.started)/60);
  const acts=d.items.filter(i=>i.outcome==="sent").length;
  const esc=d.items.filter(i=>i.verdict==="escalate").length;
  $("#bar").innerHTML=
    `<span>자동 점검 <button class="sw ${on?"on":""}" onclick="toggleAuto(${!on})">`+
    `${on?"켬":"끔"}</button></span>`+
    `<span>오늘 <b>${d.items.length}</b>/${st.daily_max}회</span>`+
    `<span>조치 <b>${acts}</b></span>`+
    `<span>사람 호출 <b>${esc}</b></span>`+
    `<span>실행 ${st.action_enabled?"켜짐":"꺼짐 (기록만)"}</span>`+
    `<span>${since} 켬 · ${mins}분</span>`;

  const byRule={};
  d.findings.filter(f=>f.state==="firing").forEach(f=>{byRule[f.ts+"|"+f.rule_id]=f;});
  const w=t=>new Date(t*1000).toLocaleTimeString("ko-KR",{hour12:false});
  const lines=[];
  Object.values(byRule).forEach(f=>lines.push(
    `<div class="ev"><span class="w">${w(f.ts)}</span> <b>${f.rule_id}</b> 발동
     <div class="sub r">${f.detail||""}</div></div>`));
  d.items.forEach(a=>lines.push(
    `<div class="ev"><span class="w">${w(a.ts)}</span>
     <b>${a.action_id||"-"}</b>
     <span class="v-${a.verdict}">${a.verdict}</span>
     ${a.outcome?`<span class="w">(${a.outcome})</span>`:""}
     <div class="sub r">${a.reason||""}${a.detail?" · "+a.detail:""}</div></div>`));
  $("#rep").innerHTML=lines.join("")||`<div class="foot">기록 없음</div>`;
  if(d.todo.length) $("#rep").innerHTML+=
    `<div class="todo"><b>지금 할 일</b>`+
    d.todo.map(t=>`<div class="r">· ${t}</div>`).join("")+`</div>`;
}
async function toggleAuto(on){
  await fetch("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({auto_check:on?"on":"off"})});
  refreshReport();
}
async function ruleEnabled(id,on){
  await fetch(`/api/rules/${id}/enabled`,{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({enabled:on})});
  refresh();
}
async function ruleDelete(id){
  if(!confirm(`규칙 ${id} 을 지웁니다. 진행할까요?`)) return;
  await fetch(`/api/rules/${id}`,{method:"DELETE"});
  refresh();
}
refresh(); refreshReport();
setInterval(refresh,10000); setInterval(refreshReport,10000);

let ws, busy=false;
function connect(){
  ws=new WebSocket(`ws://${location.host}/ws/chat`);
  ws.onclose=()=>setTimeout(connect,2000);
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.type==="proposal"){ proposal(m.rule); }
    else if(m.type==="tool"){
      planLine("→ "+m.name.replace("mcp__ops__",""));
      $("#plan").scrollTop=1e9;
      add("tool","↳ "+m.name.replace("mcp__ops__",""));
    } else if(m.type==="text"){ add("bot",m.text); }
    else if(m.type==="error"){ add("bot","오류: "+m.text); done(); }
    else if(m.type==="done"){ done(); }
  };
}
async function runThrottle(btn, raw){
  const a=JSON.parse(raw);
  if(!confirm(`${a.uri} 를 ${a.rate}% 로 ${a.ttl_minutes}분간 차단합니다. 진행할까요?`)) return;
  btn.disabled=true;
  const res=await (await fetch("/api/throttle",{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify(a)})).json();
  const out=document.createElement("div");
  out.className="out";
  out.textContent = res.ok
    ? `실행됨 (HTTP ${res.status})\n되돌리기: ${res.revert}`
    : `${res.error}\n${res.curl||""}\n${res.revert?"되돌리기: "+res.revert:""}`;
  btn.parentElement.appendChild(out);
  btn.disabled=false;
}
function proposal(r){
  const el=document.createElement("div");
  el.className="prop";
  el.innerHTML=`<div class="h">규칙 제안 · ${r.severity||"medium"}</div>
    <div>${r.title||""}</div>
    <pre>id     ${r.rule_id}
check  ${r.check_type} ${r.check_fields||""}
guard  ${r.guards||"[]"}
action ${r.action||"{}"}</pre>
    <button class="yes">승인</button><button class="no">거절</button>`;
  el.querySelector(".yes").onclick=async()=>{
    el.querySelector(".yes").disabled=true;
    const res=await (await fetch("/api/rules",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify(r)})).json();
    el.innerHTML=res.ok?`<div class="h">승인됨 · ${res.id}</div>
      <div class="foot">다음 수집 주기부터 평가합니다</div>`
      :`<div class="h">실패</div><div class="foot">${res.error}</div>`;
    refresh();
  };
  el.querySelector(".no").onclick=()=>el.remove();
  $("#plan").appendChild(el); $("#plan").scrollTop=1e9;
}
function done(){ busy=false; $("#send").disabled=false; planLine("완료"); }
function add(cls,text){
  const el=document.createElement("div");
  el.className="msg "+cls; el.textContent=text;
  $("#log").appendChild(el); $("#log").scrollTop=1e9;
}
$("#f").onsubmit=e=>{
  e.preventDefault();
  const v=$("#q").value.trim(); if(!v||busy||ws?.readyState!==1) return;
  add("me",v); $("#q").value=""; busy=true; $("#send").disabled=true;
  $("#plan").innerHTML=""; planLine("질문 수신: "+v.slice(0,40));
  ws.send(v);
};
connect();
</script>
</body>
</html>
